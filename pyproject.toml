[project]
name = "phishdet"
version = "0.1.0"
description = "Read an email and estimate whether it is phishing."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "scikit-learn==1.9.1",
  "numpy==2.5.4",
  "fastapi>=0.115",
]

[tool.vercel]
entrypoint = "app:app"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
phishdet = "phishdet.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
phishdet = ["static/*", "artifacts/*", "samples/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
